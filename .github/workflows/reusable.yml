name: Reusable deploy
on:
  workflow_call:
    inputs:
      artifact-name:
        description: The name of the artifact
        required: false
        default: dist
        type: string
    outputs:
      result:
        description: The rresult
        value: ${{ jobs.deploy.outputs.outcome }}

jobs:
  deploy:
    outputs:
      outcome: ${{ steps.step-res.outputs.step-result }}
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
      - name: List files
        run: ls
      - name: output INFO
        run: echo "deploying..."
      - name: set result output
        id: step-res
        run: echo "step-result=successPRZEMO" >> $GITHUB_OUTPUT
