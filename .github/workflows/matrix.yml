name: Matrix Demo
on: push
jobs:
  build:
    strategy:
      matrix:
        node-version: [20, 22]
        operating-system: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: get code
        uses: actions/checkout@v6
      - name: install node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: install dependencies
        run: npm ci
      - name: build project
        run: npm run build
